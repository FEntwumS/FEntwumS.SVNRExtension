name: Publish

# Nur manuell ausloesen. Der Workflow erzeugt selbst ein Release, und ein
# "release: published"-Trigger wuerde sich dadurch endlos neu starten.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Bump Version
        id: get-version
        run: |
          set -euo pipefail

          CSPROJ=src/FEntwumS.SVNRExtension/FEntwumS.SVNRExtension.csproj
          JSON=oneware-extension.json

          CURRENT=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$CSPROJ" | head -n1)
          if [ -z "$CURRENT" ]; then
            echo "Keine <Version> in $CSPROJ gefunden." >&2
            exit 1
          fi

          if ! echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$CURRENT' ist nicht im Format major.minor.patch." >&2
            exit 1
          fi

          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}

          # Nur die Patch-Stelle hochzaehlen, kein Ueberlauf: 0.4.9 -> 0.4.10.
          # Major und Minor werden ausschliesslich manuell im csproj angehoben.
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"

          echo "$CURRENT -> $NEXT"

          sed -i "s:<Version>$CURRENT</Version>:<Version>$NEXT</Version>:" "$CSPROJ"

          # Neue Version an den Anfang der Liste, damit sie im Extension Manager oben steht.
          jq --arg v "$NEXT" \
            '.versions = ([{version: $v, targets: [{target: "all"}]}] + .versions)' \
            "$JSON" > "$JSON.tmp"
          mv "$JSON.tmp" "$JSON"

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
      - name: Commit Version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FEntwumS.SVNRExtension/FEntwumS.SVNRExtension.csproj oneware-extension.json
          git commit -m "Release ${{steps.get-version.outputs.version}}"
          git push origin HEAD:${{github.ref_name}}
      - name: Build
        run: dotnet build src/FEntwumS.SVNRExtension/FEntwumS.SVNRExtension.csproj -c Release -o publish
      - name: Compress
        uses: thedoctor0/zip-release@0.7.1
        with:
          type: 'zip'
          filename: ../FEntwumS.SVNRExtension_${{steps.get-version.outputs.version}}_all.zip
          directory: ./publish
      - name: Debug
        run: ls
      - uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "FEntwumS.SVNRExtension_${{steps.get-version.outputs.version}}_all.zip,./publish/compatibility.txt"
          tag: ${{steps.get-version.outputs.version}}
          allowUpdates: true
